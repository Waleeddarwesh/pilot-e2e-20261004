# Generated by EgyKode Pilot (https://egykode.com) — review before merging.
# This file is a starting point, not a finished production configuration.
severity:
  - HIGH
  - CRITICAL

# Unfixed CVEs cannot be actioned by a rebuild, so they do not block the pipeline.
ignore-unfixed: true

scan:
  scanners:
    - vuln
    - secret
    - misconfig

vulnerability:
  type:
    - os
    - library

exit-code: 1

# Trivy only auto-detects the plain-text .trivyignore, so the YAML one — the format that can
# carry a reason next to each accepted risk — has to be named here or it is silently unused.
ignorefile: .trivyignore.yaml
