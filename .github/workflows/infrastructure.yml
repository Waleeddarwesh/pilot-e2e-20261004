# Generated by EgyKode Pilot (https://egykode.com) — review before merging.
# This file is a starting point, not a finished production configuration.
name: Infrastructure

on:
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/infrastructure.yml'

permissions:
  contents: read
  id-token: write
  # Reading the plan artifact back in the apply job. Not write: this workflow never pushes.
  actions: read

concurrency:
  # One at a time against one account. Two applies racing on the same state is how a lock file
  # becomes the only thing standing between you and a half-written infrastructure.
  group: infrastructure-production
  cancel-in-progress: false

defaults:
  run:
    working-directory: terraform

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the pinned Terraform
        env:
          TERRAFORM_VERSION: ${{ vars.TERRAFORM_VERSION || '1.10.0' }}
        run: |
          set -euo pipefail
          # GitHub's Ubuntu runner images do not ship Terraform, so assuming one is present is a
          # failure waiting for the first run. Installed here at a recorded version and verified
          # against HashiCorp's published checksums for that exact version -- a checksum written
          # into this file could not be verified when it was written and would be worse than none.
          cd "$RUNNER_TEMP"
          BASE="https://releases.hashicorp.com/terraform/$TERRAFORM_VERSION"
          curl -fsSL -o terraform.zip "$BASE/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          curl -fsSL -o SHA256SUMS "$BASE/terraform_${TERRAFORM_VERSION}_SHA256SUMS"
          grep " terraform_${TERRAFORM_VERSION}_linux_amd64.zip\$" SHA256SUMS \
            | sed "s|terraform_${TERRAFORM_VERSION}_linux_amd64.zip|terraform.zip|" \
            | sha256sum -c -
          unzip -o -q terraform.zip
          install -m 0755 terraform /usr/local/bin/terraform
          terraform version
          # Recorded, because the apply job has to run the same one against the saved plan.
          echo "$TERRAFORM_VERSION" >"$GITHUB_WORKSPACE/terraform/tfplan.terraform-version"
      - name: Require the planning role before any credential is requested
        env:
          PLAN_ROLE: ${{ secrets.AWS_PLAN_ROLE_ARN }}
        run: |
          set -euo pipefail
          # Planning authority is required, not preferred. Falling back to the deployment role
          # when this is unset would plan with permission to change infrastructure, on the job
          # that runs for every pull request. Refused here, before a credential is requested,
          # rather than after a broader role has already been assumed.
          : "${PLAN_ROLE:?Set the AWS_PLAN_ROLE_ARN secret. Planning must not fall back to the deployment role.}"
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          # Scoped to reading infrastructure, plus the S3 object write and delete the state
          # lock needs -- Terraform writes a lock object to take the lock and removes it
          # afterwards. Calling that "read-only" would be a second false guarantee, and
          # dropping locking to make one true would be worse than the wording.
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          mask-aws-account-id: true
          aws-region: us-east-1
      - name: Confirm the state backend has been bootstrapped
        run: |
          set -euo pipefail
          # The bucket is created once per project and account by terraform/bootstrap, which keeps its own
          # local state -- it cannot use the backend it exists to create. Without this the run
          # fails inside init with an error about an empty bucket name, which reads as a
          # Terraform problem rather than a setup step nobody has done yet.
          : "${TF_STATE_BUCKET:?Set the TF_STATE_BUCKET repository variable to the state_bucket_name output of terraform/bootstrap.}"
          : "${TF_STATE_KMS_KEY_ARN:?Set the TF_STATE_KMS_KEY_ARN repository variable to the state_kms_key_arn output of terraform/bootstrap.}"
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_KMS_KEY_ARN: ${{ vars.TF_STATE_KMS_KEY_ARN }}
      - name: Initialise the shared backend
        run: |
          set -euo pipefail
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=repo/production/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="kms_key_id=${{ vars.TF_STATE_KMS_KEY_ARN }}"
      - name: Formatting and validity
        run: |
          set -euo pipefail
          terraform fmt -check -recursive
          terraform validate
      - name: Plan
        run: |
          set -euo pipefail
          terraform plan -input=false -lock-timeout=5m \
            -var-file="envs/production.tfvars" \
            -out=tfplan
          # A readable rendering beside the binary plan, so the reviewer is not asked to approve
          # an opaque file.
          terraform show -no-color tfplan >tfplan.txt
      - name: Publish the plan for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: terraform-plan-${{ github.sha }}
          # The binary plan is what gets applied; the text is what gets read. The lock file and
          # the version travel with them: init selects providers from a range, so an apply that
          # re-initialised on its own could resolve a different provider than the one this plan
          # was made against, and Terraform would refuse the plan rather than silently diverge.
          #
          # The binary plan can contain resource attributes and variable values. It is an
          # artifact of a protected workflow and is treated as sensitive; nothing else is added
          # to this bundle to make it more complete.
          path: |
            terraform/tfplan
            terraform/tfplan.txt
            terraform/.terraform.lock.hcl
            terraform/tfplan.terraform-version
          retention-days: 14
          if-no-files-found: error

