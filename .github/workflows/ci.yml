# This file is a starting point, not a finished production configuration.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write
  # upload-sarif reads the run it reports for.
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-services:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: services-api-0df5335f3fb1e0cd
            context: services/api
            dockerfile: services/api/Dockerfile
          - name: services-worker-5b9b422f15d4c509
            context: services/worker
            dockerfile: services/worker/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build service image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          load: true
          tags: repo-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Report service image findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: repo-${{ matrix.name }}:${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          exit-code: '0'
      # The gate: HIGH and CRITICAL findings that have a fix. Its report is kept as JSON with the
      # image it describes, and printed below, so a failed build names what to fix.
      - name: Scan service image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: repo-${{ matrix.name }}:${{ github.sha }}
          format: json
          output: trivy-gate-${{ matrix.name }}.json
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
      - name: Show and keep the scan results
        if: always()
        run: |
          docker image inspect --format '{{.Id}}' "repo-${{ matrix.name }}:${{ github.sha }}" > image-id-${{ matrix.name }}.txt || true
          echo "image: repo-${{ matrix.name }}:${{ github.sha }} $(cat image-id-${{ matrix.name }}.txt)"
          if [ -f trivy-gate-${{ matrix.name }}.json ]; then
            echo "gate policy: severity HIGH,CRITICAL, ignore-unfixed"
            jq -r '.Results[]? | .Target as $t | .Vulnerabilities[]? | [$t, .PkgName, .VulnerabilityID, .Severity, .InstalledVersion, .FixedVersion] | @tsv' trivy-gate-${{ matrix.name }}.json | column -t -s "$(printf '\t')"
            echo "gate findings: $(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy-gate-${{ matrix.name }}.json)"
          else
            echo "no gate report was written"
          fi
      - name: Attach the scan reports to the run
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-scan-${{ matrix.name }}
          path: |
            trivy-${{ matrix.name }}.sarif
            trivy-gate-${{ matrix.name }}.json
            image-id-${{ matrix.name }}.txt
          if-no-files-found: warn
          retention-days: 90
      # Code scanning needs GitHub Advanced Security on a private repository; the gate above
      # decides the build, the upload only publishes the report where it can.
      - name: Upload scan results
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
