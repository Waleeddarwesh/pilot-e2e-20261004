# Generated by EgyKode Pilot (https://egykode.com) — review before merging.
# This file is a starting point, not a finished production configuration.
name: CD

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write
  # The apply job downloads this run's plan artifact. Without this the retrieval fails on
  # a private repository, where the default token grants no artifact read at all.
  actions: read

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  preflight:
    name: Resolve the deployment configuration
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
      application_host: ${{ steps.resolve.outputs.application_host }}
      certificate_arn: ${{ steps.resolve.outputs.certificate_arn }}
      configuration: ${{ steps.resolve.outputs.configuration }}
    steps:
      - name: Resolve and check one configuration for this run
        id: resolve
        env:
          REQUESTED_ENVIRONMENT: ${{ vars.ENVIRONMENT }}
          APPLICATION_HOST: ${{ vars.APPLICATION_HOST }}
          CERTIFICATE_ARN: ${{ vars.CERTIFICATE_ARN }}
        run: |
          set -euo pipefail
          # One line, matched whole.
          #
          # An anchored grep matches *a* line, so a valid first line followed by anything at all
          # was accepted -- and the rest was written into the job output below as further
          # NAME=VALUE assignments, which a reader takes as the value. A host whose second line
          # read application_host=elsewhere.example.test passed, the digest was computed over the
          # first value, and the pipeline carried the second.
          #
          # A control character is refused outright rather than stripped: stripping would hash one
          # value and use another, which is the same defect wearing a fix.
          scalar() {
            if [ "$(printf '%s' "$2" | tr -d '[:cntrl:]')" != "$2" ]; then
              echo "$1 contains a line break or a control character." >&2
              return 1
            fi
            if ! printf '%s' "$2" | grep -Eq "$3"; then
              echo "$1 is not in the form this pipeline requires: $4" >&2
              return 1
            fi
          }
          # The cluster, service and task family read this variable while the plan, the state key
          # and the approval environment were fixed to production. Setting it to
          # anything else retargeted the deployment commands alone -- applying one environment and
          # rolling out to another.
          ENVIRONMENT="${REQUESTED_ENVIRONMENT:-production}"
          scalar ENVIRONMENT "$ENVIRONMENT" '^[a-z][a-z0-9-]{0,30}$' 'a single lowercase name'
          if [ "$ENVIRONMENT" != "production" ]; then
            echo "This pipeline plans, approves and deploys production." >&2
            echo "ENVIRONMENT is set to $ENVIRONMENT, which nothing here would apply." >&2
            exit 1
          fi
          # Complete and well formed, not merely present. A half-configuration or a value of the
          # wrong shape used to be caught by the health check, after the rollout it describes.
          if [ -z "${CERTIFICATE_ARN:-}" ] || [ -z "${APPLICATION_HOST:-}" ]; then
            echo "A production rollout needs TLS: set CERTIFICATE_ARN and APPLICATION_HOST." >&2
            echo "Both are repository variables, and both are inputs to the plan this run applies." >&2
            echo "For a plain-HTTP preview, run the generated compose.yml locally: this pipeline serves production." >&2
            exit 1
          fi
          scalar CERTIFICATE_ARN "$CERTIFICATE_ARN" \
            '^arn:aws[a-z-]*:acm:[a-z0-9-]+:[0-9]{12}:certificate/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$' \
            'an ACM certificate ARN'
          scalar APPLICATION_HOST "$APPLICATION_HOST" \
            '^[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?)+$' \
            'a hostname such as api.example.com, not a URL, a port or a path'
          # What every later job is bound to. A digest rather than the values, so the comparison
          # downstream is one string and reads in a log without repeating an account identifier.
          CONFIGURATION="$(printf '%s\n%s\n%s\n' \
            "$ENVIRONMENT" "${APPLICATION_HOST:-}" "${CERTIFICATE_ARN:-}" \
            | sha256sum | cut -c1-16)"
          {
            echo "environment=$ENVIRONMENT"
            echo "application_host=${APPLICATION_HOST:-}"
            echo "certificate_arn=${CERTIFICATE_ARN:-}"
            echo "configuration=$CONFIGURATION"
          } >>"$GITHUB_OUTPUT"
          echo "Deploying $ENVIRONMENT as configuration $CONFIGURATION."

  infrastructure:
    name: Plan infrastructure for this revision
    needs: [preflight]
    runs-on: ubuntu-latest
    outputs:
      changes: ${{ steps.plan.outputs.changes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the pinned Terraform
        env:
          TERRAFORM_VERSION: ${{ vars.TERRAFORM_VERSION || '1.10.0' }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          BASE="https://releases.hashicorp.com/terraform/$TERRAFORM_VERSION"
          curl -fsSL -o terraform.zip "$BASE/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          curl -fsSL -o SHA256SUMS "$BASE/terraform_${TERRAFORM_VERSION}_SHA256SUMS"
          grep " terraform_${TERRAFORM_VERSION}_linux_amd64.zip\$" SHA256SUMS \
            | sed "s|terraform_${TERRAFORM_VERSION}_linux_amd64.zip|terraform.zip|" \
            | sha256sum -c -
          unzip -o -q terraform.zip
          install -m 0755 terraform /usr/local/bin/terraform
          echo "$TERRAFORM_VERSION" >"$GITHUB_WORKSPACE/terraform/tfplan.terraform-version"
      - name: Require the planning role before any credential is requested
        env:
          PLAN_ROLE: ${{ secrets.AWS_PLAN_ROLE_ARN }}
        run: |
          set -euo pipefail
          : "${PLAN_ROLE:?Set the AWS_PLAN_ROLE_ARN secret. Planning must not fall back to the deployment role.}"
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          mask-aws-account-id: true
          aws-region: me-central-1
      - name: Initialise the shared backend
        working-directory: terraform
        run: |
          set -euo pipefail
          : "${TF_STATE_BUCKET:?Set the TF_STATE_BUCKET repository variable to the state_bucket_name output of terraform/bootstrap.}"
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=repo/production/terraform.tfstate" \
            -backend-config="region=me-central-1" \
            -backend-config="kms_key_id=${{ vars.TF_STATE_KMS_KEY_ARN }}"
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      - name: Plan
        id: plan
        working-directory: terraform
        env:
          # The configuration preflight resolved, as Terraform input variables. This is the whole
          # handoff: the listener, its certificate and the hostname the health check later uses
          # are planned from the same three values, rather than the plan defaulting them to empty
          # while a later gate checked the repository variables and passed.
          TF_VAR_certificate_arn: ${{ needs.preflight.outputs.certificate_arn }}
          TF_VAR_application_host: ${{ needs.preflight.outputs.application_host }}
          APPROVED_ENVIRONMENT: ${{ needs.preflight.outputs.environment }}
          PLANNED_CONFIGURATION: ${{ needs.preflight.outputs.configuration }}
        run: |
          set -euo pipefail
          # Precedence, settled rather than assumed.
          #
          # Terraform's order, lowest to highest: a variable default, then TF_VAR_ environment
          # variables, then terraform.tfvars, then terraform.tfvars.json, then *.auto.tfvars, then
          # -var-file and -var on the command line. So a file assignment beats a TF_VAR_, and a
          # tfvars assigning certificate_arn planned a listener this run never resolved -- while
          # the digest beside the plan still described the resolved one. A command-line -var is the
          # highest tier there is, so these two inputs are the run's and no file can take them.
          # Where a file does assign them, that is said out loud rather than silently overridden.
          for candidate in terraform.tfvars terraform.tfvars.json envs/production.tfvars *.auto.tfvars *.auto.tfvars.json; do
            [ -f "$candidate" ] || continue
            if grep -Eq '^[[:space:]]*"?(certificate_arn|application_host)"?[[:space:]]*[=:]' "$candidate"; then
              echo "::warning::$candidate assigns certificate_arn or application_host; this run plans the values its preflight resolved."
            fi
          done
          # The environment decides what every generated resource is named, and it is the third
          # field of the configuration this run approved. It is not pinned with -var: a repository
          # that maintains its own environments should be able to. The -var-file below is the
          # highest precedence tier, so envs/ENVIRONMENT.tfvars already wins over any auto-loaded
          # file -- these refusals are a configuration policy, not a precedence fix. Two places
          # assigning the deployment's own identity is ambiguous whichever one Terraform picks,
          # and this pipeline will not guess which the approval was about.
          for candidate in terraform.tfvars terraform.tfvars.json *.auto.tfvars *.auto.tfvars.json; do
            [ -f "$candidate" ] || continue
            if grep -Eq '^[[:space:]]*"?environment"?[[:space:]]*[=:]' "$candidate"; then
              echo "$candidate assigns environment, and so does envs/production.tfvars." >&2
              echo "This pipeline reads the environment from that file to bind the plan to its approval." >&2
              echo "Two assignments of the deployment's identity is one too many. Remove this one." >&2
              exit 1
            fi
          done
          # An ambient TF_VAR_environment, which the file loop above cannot see.
          #
          # It does not outrank anything -- Terraform ranks TF_VAR_ *below* every tfvars file and
          # far below the -var-file this step passes. What it does is supply the value when no file
          # assigns one, which is exactly the case that got through: a tfvars with no environment
          # assignment, an exported TF_VAR_environment=staging, and a staging plan carrying the
          # production digest. The apply now reads the environment out of the plan and settles it
          # either way; this refuses it here, where the message can say what to change.
          if [ -n "${TF_VAR_environment:-}" ]; then
            echo "TF_VAR_environment is set to '$TF_VAR_environment'." >&2
            echo "This pipeline resolves the environment itself and plans production." >&2
            echo "Unset it, or change the approved environment." >&2
            exit 1
          fi
          # Tolerant of no match, because no match is an answer here: under pipefail grep's exit 1
          # would end the step before the fallback below could give one.
          PLANNED_ENVIRONMENT="$(grep -E '^[[:space:]]*environment[[:space:]]*=' \
            "envs/production.tfvars" | head -1 | cut -d'"' -f2 || true)"
          # No assignment is not a conflict: the root either declares no such variable or falls
          # back to its own default, and in neither case is anything overriding the environment
          # this run approved. A file assigning a *different* one is what this guards against.
          PLANNED_ENVIRONMENT="${PLANNED_ENVIRONMENT:-$APPROVED_ENVIRONMENT}"
          # -detailed-exitcode: 0 is "no changes", 2 is "changes", 1 is an error. An application
          # change that touches no infrastructure therefore needs no approval and no apply, and a
          # change that does touch infrastructure cannot slip past one.
          set +e
          terraform plan -input=false -lock-timeout=5m -detailed-exitcode \
            -var-file="envs/production.tfvars" \
            -var="certificate_arn=$TF_VAR_certificate_arn" \
            -var="application_host=$TF_VAR_application_host" \
            -out=tfplan
          STATUS=$?
          set -e
          case "$STATUS" in
            0) echo "changes=false" >>"$GITHUB_OUTPUT" ;;
            2) echo "changes=true" >>"$GITHUB_OUTPUT" ;;
            *) exit "$STATUS" ;;
          esac
          terraform show -no-color tfplan >tfplan.txt
          # The configuration this plan carries, computed from what the plan carries.
          #
          # This copied the digest the run resolved, which describes the *input* and not the
          # result: a plan whose environment came from a tfvars saying staging was stamped with
          # the production digest and passed the apply. Recomputing it here from the environment
          # the plan will use means the apply compares two statements about the same plan.
          PLANNED_CONFIGURATION="$(printf '%s\n%s\n%s\n' \
            "$PLANNED_ENVIRONMENT" "$TF_VAR_application_host" "$TF_VAR_certificate_arn" \
            | sha256sum | cut -c1-16)"
          printf '%s\n' "$PLANNED_CONFIGURATION" >tfplan.configuration
          # Copied to a visible name before it is uploaded. upload-artifact excludes
          # hidden files unless include-hidden-files is set, and setting that would
          # sweep in every other dotfile in the directory -- so the one file that has to
          # travel is renamed rather than the policy loosened.
          cp .terraform.lock.hcl tfplan.lock.hcl
      - name: Publish the plan for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: terraform-plan-${{ github.sha }}
          path: |
            terraform/tfplan
            terraform/tfplan.txt
            terraform/tfplan.lock.hcl
            terraform/tfplan.terraform-version
            terraform/tfplan.configuration
          retention-days: 14
          if-no-files-found: error

  infrastructure-apply:
    name: Apply the reviewed infrastructure plan
    runs-on: ubuntu-latest
    needs: [preflight, infrastructure]
    # Only when the plan found something to do. An application-only release does not ask anyone
    # to approve an empty change.
    if: needs.infrastructure.outputs.changes == 'true'
    # The approval is a repository setting on this environment, not a property of this line.
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Retrieve the plan that was reviewed
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_CONFIGURATION: ${{ needs.preflight.outputs.configuration }}
        run: |
          set -euo pipefail
          gh run download "${{ github.run_id }}" --name "terraform-plan-${{ github.sha }}" --dir terraform
          test -s terraform/tfplan
          test -s terraform/tfplan.lock.hcl
          cp terraform/tfplan.lock.hcl terraform/.terraform.lock.hcl
          test -s terraform/tfplan.terraform-version
          # The plan is applied as saved, so the configuration it was made under is the one that
          # gets applied. This refuses a plan built under a different one rather than applying a
          # listener nobody reviewed -- and refuses a configuration recorded beside some other
          # plan, which the label on its own could not tell apart.
          test -s terraform/tfplan.configuration
          PLANNED="$(cat terraform/tfplan.configuration)"
          if [ "$PLANNED" != "$EXPECTED_CONFIGURATION" ]; then
            echo "This plan was made under configuration $PLANNED." >&2
            echo "This run resolved $EXPECTED_CONFIGURATION. Re-plan before applying." >&2
            exit 1
          fi
      - name: Install the Terraform that produced this plan
        run: |
          set -euo pipefail
          TERRAFORM_VERSION="$(cat terraform/tfplan.terraform-version)"
          cd "$RUNNER_TEMP"
          BASE="https://releases.hashicorp.com/terraform/$TERRAFORM_VERSION"
          curl -fsSL -o terraform.zip "$BASE/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          curl -fsSL -o SHA256SUMS "$BASE/terraform_${TERRAFORM_VERSION}_SHA256SUMS"
          grep " terraform_${TERRAFORM_VERSION}_linux_amd64.zip\$" SHA256SUMS \
            | sed "s|terraform_${TERRAFORM_VERSION}_linux_amd64.zip|terraform.zip|" \
            | sha256sum -c -
          unzip -o -q terraform.zip
          install -m 0755 terraform /usr/local/bin/terraform
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          mask-aws-account-id: true
          aws-region: me-central-1
      - name: Apply exactly that plan
        working-directory: terraform
        env:
          EXPECTED_CONFIGURATION: ${{ needs.preflight.outputs.configuration }}
          EXPECTED_ENVIRONMENT: ${{ needs.preflight.outputs.environment }}
          EXPECTED_HOST: ${{ needs.preflight.outputs.application_host }}
          EXPECTED_CERTIFICATE: ${{ needs.preflight.outputs.certificate_arn }}
        run: |
          set -euo pipefail
          terraform init -input=false -lockfile=readonly \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=repo/production/terraform.tfstate" \
            -backend-config="region=me-central-1" \
            -backend-config="kms_key_id=${{ vars.TF_STATE_KMS_KEY_ARN }}"
          # What this plan will actually do, read out of the plan itself.
          #
          # The digest beside the plan is a label, and a label describes its input rather than the
          # result: a plan whose TLS inputs had been overridden carried the approved label and
          # passed. Terraform's own reading of the saved plan is the only thing that settles which
          # values this apply is about to use, and it happens here, before it uses them.
          EFFECTIVE="$(terraform show -json tfplan | jq -r \
            '[.variables.environment.value // "", .variables.application_host.value // "", .variables.certificate_arn.value // ""] | @tsv')"
          EFFECTIVE_ENVIRONMENT="$(printf '%s' "$EFFECTIVE" | cut -f1)"
          EFFECTIVE_HOST="$(printf '%s' "$EFFECTIVE" | cut -f2)"
          EFFECTIVE_CERTIFICATE="$(printf '%s' "$EFFECTIVE" | cut -f3)"
          # Absent is not empty and not approved. A plan that carries no value for one of these
          # has not been shown to match anything, and comparing "" against "" would pass it.
          if [ -z "$EFFECTIVE_ENVIRONMENT" ] || [ -z "$EFFECTIVE_HOST" ] || [ -z "$EFFECTIVE_CERTIFICATE" ]; then
            echo "This plan does not carry an environment, a hostname and a certificate." >&2
            echo "Nothing can be approved that the plan itself does not state." >&2
            exit 1
          fi
          if [ "$EFFECTIVE_HOST" != "$EXPECTED_HOST" ] || [ "$EFFECTIVE_CERTIFICATE" != "$EXPECTED_CERTIFICATE" ]; then
            echo "This plan configures a different endpoint than the run that approved it." >&2
            echo "Approved host $EXPECTED_HOST; the plan carries $EFFECTIVE_HOST." >&2
            exit 1
          fi
          # The third field, read from the plan rather than taken on trust.
          #
          # This compared the sidecar digest and nothing else for the environment, and the sidecar
          # is built by the plan step from a grep of the tfvars file. Two things got past it: a
          # an ambient TF_VAR_environment supplies the value when no file assigns one, so the grep
          # described a value the plan did not use; and the first assignment the grep matched could
          # be inside an HCL block comment while the real one below it said something else. Both
          # produced a staging plan carrying the production approval, and both reached the apply.
          #
          # Terraform's own reading of the saved plan is what settles it, for all three values.
          if [ "$EFFECTIVE_ENVIRONMENT" != "$EXPECTED_ENVIRONMENT" ]; then
            echo "This plan is for $EFFECTIVE_ENVIRONMENT and $EXPECTED_ENVIRONMENT was approved." >&2
            echo "Re-plan before applying: nothing about this plan was reviewed for $EFFECTIVE_ENVIRONMENT." >&2
            exit 1
          fi
          # The sidecar as well, which binds the artifact to the run that produced it. It is an
          # accelerator and a provenance check, not the verification above.
          test -s tfplan.configuration
          PLANNED="$(cat tfplan.configuration)"
          if [ "$PLANNED" != "$EXPECTED_CONFIGURATION" ]; then
            echo "This plan carries configuration $PLANNED, and $EXPECTED_ENVIRONMENT was approved as $EXPECTED_CONFIGURATION." >&2
            echo "Re-plan before applying: the environment, the host or the certificate is not the one that was reviewed." >&2
            exit 1
          fi
          terraform apply -input=false -lock-timeout=5m tfplan

  publish:
    name: Publish ${{ matrix.name }}
    needs: [preflight, infrastructure, infrastructure-apply]
    # A skipped apply is a pass: that is what an application-only release produces,
    # where the plan found nothing to apply. A failed or cancelled one is not. Preflight
    # is required outright: nothing is built for a run whose configuration was refused.
    if: >-
      ${{ always()
      && needs.preflight.result == 'success'
      && needs.infrastructure.result == 'success'
      && (needs.infrastructure-apply.result == 'success'
          || needs.infrastructure-apply.result == 'skipped') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: services-api-0df5335f3fb1e0cd
            context: services/api
            dockerfile: services/api/Dockerfile
          - name: services-worker-5b9b422f15d4c509
            context: services/worker
            dockerfile: services/worker/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The publish role: a push to main, this project's ECR repositories only. Not the deploy
      # role, which trusts only the production environment this job does not run in.
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_PUBLISH_ROLE_ARN }}
          mask-aws-account-id: true
          aws-region: me-central-1
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
        id: ecr
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Compute immutable image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - name: Build and push service image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ matrix.name }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}


  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: [preflight, publish]
    # The review gate. A protected environment holds this job until a required reviewer approves
    # it, which is the only thing standing between a merge and production.
    environment: production
    env:
      # One identity mapping, written from the same values the Terraform in this repository uses,
      # so a generated command cannot address a resource nothing created.
      #
      # These are four different names and were treated as one. The image repository is the
      # workload's own name; the cluster, the ECS service and the task family are all
      # local.name in the root module, which is app_name joined to environment; and the
      # container inside the task definition is named app. Deployment used the image name for
      # the service and the family, so every command addressed something that does not exist.
      ECR_REPOSITORY: services-api-0df5335f3fb1e0cd
      CLUSTER: repo-production
      SERVICE: repo-production
      TASK_FAMILY: repo-production
      # The container name in the generated task definition. Rewriting by position instead would
      # replace whichever container happens to be first once a sidecar is added.
      CONTAINER: app
      # The count the service is sized for, from the same figure the Terraform variable gets.
      # Terraform creates the service with zero tasks so no placeholder image ever serves, and
      # stops asserting the count afterwards, so delivery is what brings it up. The count the
      # estimate bills: nothing scales the service, so a lower floor would run below its sizing
      # (G0, 2026-10-02: 2 tasks ran against 3 billed).
      DESIRED_COUNT: 3
      # The background workload, which the estimate charges for and delivery has to start.
      # Same image, the command Terraform gave it, its own service and its own count.
      WORKER_SERVICE: repo-production-worker
      WORKER_FAMILY: repo-production-worker
      WORKER_CONTAINER: worker
      WORKER_DESIRED_COUNT: 1
      # The image this workload's own build produces. The same one the service runs where they
      # share a build; its own repository where the repository builds it separately.
      WORKER_ECR_REPOSITORY: services-worker-5b9b422f15d4c509
      # The host delivery checks after a rollout, and whether TLS is configured for it.
      #
      # The health step used to read APPLICATION_URL, which no workflow, job or step ever
      # exported -- a GitHub configuration variable is reached through the vars context and does
      # not become a shell variable on its own. So the check always fell back to plain HTTP
      # against the balancer, which answers a redirect once a certificate is configured.
      APPLICATION_HOST: ${{ needs.preflight.outputs.application_host }}
      CERTIFICATE_ARN: ${{ needs.preflight.outputs.certificate_arn }}
    steps:
      - name: Deploy the configuration that was planned and approved
        env:
          PLANNED: ${{ needs.preflight.outputs.configuration }}
          REQUESTED_ENVIRONMENT: ${{ vars.ENVIRONMENT }}
          CURRENT_HOST: ${{ vars.APPLICATION_HOST }}
          CURRENT_CERTIFICATE: ${{ vars.CERTIFICATE_ARN }}
        run: |
          set -euo pipefail
          # Preflight refused an absent or malformed configuration before anything was applied or
          # published; this is the other half of that. The approval between them can take hours,
          # and a repository variable edited in the meantime would otherwise send the rollout to a
          # host the reviewed plan never configured -- while the listener still terminates TLS for
          # the old one. What was planned is what gets deployed, or nothing does.
          CURRENT="$(printf '%s\n%s\n%s\n' \
            "${REQUESTED_ENVIRONMENT:-production}" "${CURRENT_HOST:-}" "${CURRENT_CERTIFICATE:-}" \
            | sha256sum | cut -c1-16)"
          if [ "$CURRENT" != "$PLANNED" ]; then
            echo "The deployment configuration changed after this run was planned." >&2
            echo "Planned $PLANNED, now $CURRENT. Re-run the pipeline to plan the new one." >&2
            exit 1
          fi
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          mask-aws-account-id: true
          aws-region: me-central-1
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
        id: ecr
      - name: Resolve the image this run pushed to an immutable digest
        id: image
        run: |
          set -euo pipefail
          # The tag is an addressing convenience; what gets deployed is the digest it resolves to
          # now. A tag can be moved after this step reads it and the deployment is unaffected.
          DIGEST="$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="${GITHUB_SHA::12}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          test -n "$DIGEST" && test "$DIGEST" != None
          echo "ref=${{ steps.ecr.outputs.registry }}/$ECR_REPOSITORY@$DIGEST" >>"$GITHUB_OUTPUT"
      - name: Register a task definition for that exact image
        id: task
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail
          # Only the image changes. Everything else -- cpu, memory, secrets, roles, log
          # configuration -- is carried over from the revision Terraform created, so this
          # pipeline cannot quietly become a second source of infrastructure truth.
          aws ecs describe-task-definition \
            --task-definition "$TASK_FAMILY" \
            --query taskDefinition >current.json
          jq --arg image "$IMAGE" --arg container "$CONTAINER" \
            '(.containerDefinitions[] | select(.name == $container) | .image) = $image
             | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                   .compatibilities, .registeredAt, .registeredBy)' \
            current.json >next.json
          ARN="$(aws ecs register-task-definition \
            --cli-input-json file://next.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)"
          echo "arn=$ARN" >>"$GITHUB_OUTPUT"
      - name: Roll out, wait, and verify what is actually running
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
          WANTED: ${{ steps.task.outputs.arn }}
        run: |
          set -euo pipefail
          aws ecs update-service \
            --cluster "$CLUSTER" \
            --service "$SERVICE" \
            --task-definition "$WANTED" \
            --desired-count "$DESIRED_COUNT"
          # Stability is necessary and not sufficient. The waiter checks task counts and
          # deployment state; it does not check *which* revision stabilised. A task that
          # crash-loops under the deployment circuit breaker rolls back to the previous
          # release, and the service becomes stable on that -- so waiting alone reports a
          # healthy old version as a successful new deployment.
          aws ecs wait services-stable \
            --cluster "$CLUSTER" \
            --services "$SERVICE"
          RUNNING="$(aws ecs describe-services \
            --cluster "$CLUSTER" \
            --services "$SERVICE" \
            --query 'services[0].deployments[?status==`PRIMARY`].taskDefinition | [0]' \
            --output text)"
          if [ "$RUNNING" != "$WANTED" ]; then
            echo "Asked for $WANTED; the primary deployment is running $RUNNING." >&2
            echo "A rollback or a substitution is not a successful release." >&2
            exit 1
          fi
          # And the image inside that revision, because a revision number is not an identity:
            
          RUNNING_IMAGE="$(aws ecs describe-task-definition \
            --task-definition "$RUNNING" \
            --query "taskDefinition.containerDefinitions[?name=='${CONTAINER}'].image | [0]" \
            --output text)"
          if [ "$RUNNING_IMAGE" != "$IMAGE" ]; then
            echo "Asked for $IMAGE; the running revision holds $RUNNING_IMAGE." >&2
            exit 1
          fi
          echo "Running $RUNNING with $RUNNING_IMAGE."
      - name: Roll out the worker onto the image this run built
        env:
          SERVICE_IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail
          # Its own image where its own Dockerfile builds one, resolved to a digest exactly as
          # the serving image is. Reusing the serving digest deployed the web application twice
          # and left this workload's published image sitting in its repository, untouched.
          if [ "$WORKER_ECR_REPOSITORY" = "$ECR_REPOSITORY" ]; then
            IMAGE="$SERVICE_IMAGE"
          else
            WORKER_DIGEST="$(aws ecr describe-images \
              --repository-name "$WORKER_ECR_REPOSITORY" \
              --image-ids imageTag="${GITHUB_SHA::12}" \
              --query 'imageDetails[0].imageDigest' \
              --output text)"
            test -n "$WORKER_DIGEST" && test "$WORKER_DIGEST" != None
            IMAGE="${{ steps.ecr.outputs.registry }}/$WORKER_ECR_REPOSITORY@$WORKER_DIGEST"
          fi
          # Its own revision, because it is its own service: the command, cpu, memory, roles and
          # log configuration are Terraform's and are carried over untouched. Only the image
          # changes, exactly as it does for the serving revision above.
          aws ecs describe-task-definition \
            --task-definition "$WORKER_FAMILY" \
            --query taskDefinition >worker-current.json
          jq --arg image "$IMAGE" --arg container "$WORKER_CONTAINER" \
            '(.containerDefinitions[] | select(.name == $container) | .image) = $image
             | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                   .compatibilities, .registeredAt, .registeredBy)' \
            worker-current.json >worker-next.json
          WANTED="$(aws ecs register-task-definition \
            --cli-input-json file://worker-next.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)"
          # Revision and count together, so the worker is never raised onto the placeholder the
          # service was created with.
          aws ecs update-service \
            --cluster "$CLUSTER" \
            --service "$WORKER_SERVICE" \
            --task-definition "$WANTED" \
            --desired-count "$WORKER_DESIRED_COUNT"
          aws ecs wait services-stable \
            --cluster "$CLUSTER" \
            --services "$WORKER_SERVICE"
          # A worker answers no request, so nothing downstream would notice it rolling back.
          # Stability is checked the same way the service's is, for the same reason.
          RUNNING="$(aws ecs describe-services \
            --cluster "$CLUSTER" \
            --services "$WORKER_SERVICE" \
            --query 'services[0].deployments[?status==`PRIMARY`].taskDefinition | [0]' \
            --output text)"
          if [ "$RUNNING" != "$WANTED" ]; then
            echo "Asked for $WANTED; the worker's primary deployment is running $RUNNING." >&2
            echo "A rollback or a substitution is not a successful release." >&2
            exit 1
          fi
          RUNNING_IMAGE="$(aws ecs describe-task-definition \
            --task-definition "$RUNNING" \
            --query "taskDefinition.containerDefinitions[?name=='${WORKER_CONTAINER}'].image | [0]" \
            --output text)"
          if [ "$RUNNING_IMAGE" != "$IMAGE" ]; then
            echo "Asked for $IMAGE; the running worker revision holds $RUNNING_IMAGE." >&2
            exit 1
          fi
          echo "Worker running $RUNNING with $RUNNING_IMAGE."
      - name: Check the application answers through its load balancer
        run: |
          set -euo pipefail
          # A stable service is not a working one: the tasks are running and registered, which
          # says nothing about whether the application serves. This asks the load balancer the
          # same question the target group asks, from outside the VPC.
          #
          # 2xx only. Accepting 3xx meant the redirect the load balancer itself returns counted
          # as the application answering -- a 301 to a port with nothing behind it passed this
          # check, which is exactly the deployment it was meant to catch.
          DNS="$(aws elbv2 describe-load-balancers \
            --names "$(printf %s "$SERVICE" | cut -c1-32)" \
            --query 'LoadBalancers[0].DNSName' \
            --output text)"
          test -n "$DNS" && test "$DNS" != None
          # The scheme follows the certificate, and the host follows the domain.
          #
          # A load balancer DNS name is not covered by the certificate, so checking HTTPS
          # against it fails verification -- and checking HTTP against a TLS deployment is
          # answered by the redirect, which is not the application. Configuring one without the
          # other is therefore refused rather than quietly downgraded.
          if [ -n "${CERTIFICATE_ARN:-}" ] && [ -z "${APPLICATION_HOST:-}" ]; then
            echo "A certificate is configured but APPLICATION_HOST is not." >&2
            echo "Set the hostname the certificate covers; the load balancer name is not it." >&2
            exit 1
          fi
          if [ -n "${APPLICATION_HOST:-}" ] && [ -z "${CERTIFICATE_ARN:-}" ]; then
            echo "APPLICATION_HOST is set but no certificate is configured." >&2
            echo "The listener would serve plain HTTP on a name that promises otherwise." >&2
            exit 1
          fi
          if [ -n "${APPLICATION_HOST:-}" ]; then
            SCHEME=https
            HOST="$APPLICATION_HOST"
          else
            SCHEME=http
            HOST="$DNS"
          fi
          case "$HOST" in
            *://*) echo "APPLICATION_HOST is a hostname, not a URL: $HOST" >&2; exit 1 ;;
          esac
          for attempt in $(seq 1 30); do
            # Transport and status are separate questions, and combining them accepted
            # failures: a substitution falling back to 000 appends to whatever curl had already
            # written, so a partial transfer that printed 200 and exited 18 produced the
            # string "200000" -- which matched the 2xx case and passed. A body that never
            # finished arriving is not an application answering.
            set +e
            CODE="$(curl -sS -o /dev/null -w '%{http_code}' \
              --max-time 10 "$SCHEME://$HOST/health")"
            TRANSPORT=$?
            set -e
            if [ "$TRANSPORT" -ne 0 ]; then
              echo "attempt $attempt: curl exited $TRANSPORT before the response completed"
            else
              case "$CODE" in
                2[0-9][0-9]) echo "$CODE from $SCHEME://$HOST"; exit 0 ;;
                3[0-9][0-9]) echo "attempt $attempt: $CODE is a redirect, not the application" ;;
                *) echo "attempt $attempt: $CODE" ;;
              esac
            fi
            sleep 10
          done
          echo "The deployment is stable but the application did not answer." >&2
          exit 1
