misconfigurations:
  - id: AWS-0053
    statement: >-
      The load balancer is internet-facing, which is what a public service is for. Traffic
      reaches it on 80 and 443 only, and the tasks behind it sit in private subnets with no
      route in except from this security group. Remove this entry if the service stops being
      public.

  - id: AWS-0054
    statement: >-
      With certificate_arn empty, port 80 forwards to the service over plain HTTP. TLS needs a
      certificate for a domain, and neither can be invented from source, so the plan reports
      this as a preview configuration rather than a production one. Issue an ACM certificate
      for the domain this will serve and set certificate_arn: port 80 then redirects to 443,
      where TLS terminates, and this finding no longer applies. Delete this entry then.

  - id: AWS-0104
    statement: >-
      The task security group allows egress to any address. A task pulls its image from ECR,
      writes to CloudWatch Logs, reads its credentials from Secrets Manager, and reaches the
      database, the cache and whatever else the application itself calls — several of which
      span AWS address ranges that change without notice, and the last of which this project
      cannot enumerate from source. The load balancer rule beside it has already been narrowed
      to the tasks. Set enable_vpc_endpoints on the network module and replace this rule with
      endpoint-scoped egress, then delete this entry.
